<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hitster Bingo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-lights" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- 1. Setup -->
  <section id="setup" class="screen" hidden></section>

  <!-- 2. Game -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <div class="brand">🪩 <span>Hitster Bingo</span></div>
      <div id="djChip" class="dj-chip"></div>
      <div class="side-toggle" role="group" aria-label="Side">
        <button data-action="side" data-side="A">A · Easy</button>
        <button data-action="side" data-side="B">B · Hard</button>
      </div>
      <button id="undoBtn" class="btn ghost" data-action="undo" title="Undo last action">↶ <span>Undo</span></button>
      <button class="btn ghost icon" data-action="rules" title="Rules" aria-label="Rules">ⓘ</button>
      <button class="btn ghost icon" data-action="menu" title="Menu" aria-label="Menu">☰</button>
    </header>

    <main class="layout">
      <div class="col-play">
        <div id="spinner" class="spinner">
          <div class="ball-wrap" data-action="spin" role="button" aria-label="Spin the disco ball">
            <div class="rays"></div>
            <svg id="rim" class="rim" viewBox="-120 -120 240 240" aria-hidden="true"></svg>
            <div id="ball" class="ball"><svg id="ballSvg" viewBox="-100 -100 200 200" aria-hidden="true"></svg></div>
            <div class="ball-shine"></div>
            <svg class="pointer" viewBox="0 0 40 52" aria-hidden="true">
              <path d="M20 50 C14 38 4 30 4 18 A16 16 0 0 1 36 18 C36 30 26 38 20 50Z" />
              <circle cx="20" cy="18" r="7" />
            </svg>
            <div id="hub" class="hub">SPIN</div>
          </div>
        </div>
      </div>

      <aside class="col-info">
        <div id="cards" class="cards"></div>
        <div id="stage" class="stage"></div>
      </aside>
    </main>
  </section>

  <!-- 3. Win -->
  <section id="win" class="win" hidden>
    <canvas id="confetti"></canvas>
    <div id="winBox" class="win-box"></div>
  </section>

  <div id="modal" class="modal" hidden><div id="modalBox" class="modal-box"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
